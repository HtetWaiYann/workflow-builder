services:
  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: workflow_builder
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-workflow} -d workflow_builder',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Application ───────────────────────────────────────────────────────────

  backend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      # Anonymous volume prevents host node_modules from shadowing the container's install
      - /app/node_modules
    env_file: packages/backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-workflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/workflow_builder?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    command: >
      sh -c "npm ci &&
             npm run build:shared &&
             cd packages/backend &&
             npx prisma migrate deploy &&
             cd /app &&
             npm run dev:backend"

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      # Anonymous volume prevents host node_modules from shadowing the container's install
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - '5173:5173'
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c "npm ci &&
             npm run build:shared &&
             npm run dev:frontend"

volumes:
  postgres_dev_data:
  redis_dev_data:

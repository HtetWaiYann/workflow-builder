services:
  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: workflow_builder
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-workflow} -d workflow_builder',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Application ───────────────────────────────────────────────────────────

  backend:
    image: ${IMAGE_REGISTRY}/triggr-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    env_file: packages/backend/.env
    environment:
      # Override connection strings so they point to Docker service names
      DATABASE_URL: postgresql://${POSTGRES_USER:-workflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/workflow_builder?schema=public
      REDIS_URL: redis://redis:6379
      # Set via root .env on the server (e.g. CORS_ORIGIN=https://triggr.htetwaiyan.com)
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No ports mapping — backend is only reachable through the nginx proxy inside Docker

  frontend:
    image: ${IMAGE_REGISTRY}/triggr-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    restart: unless-stopped
    # Bind to 127.0.0.1 so only the host nginx reverse proxy can reach this container.
    # Direct access from the internet is blocked.
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

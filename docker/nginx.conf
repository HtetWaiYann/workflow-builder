server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # The frontend prefixes every API call with /api/. Strip it and forward to
    # the backend container on Docker's internal network — the backend is never
    # reachable from outside Docker.
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward Set-Cookie as-is so httpOnly JWT cookies survive the proxy
        proxy_pass_header Set-Cookie;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # External services (GitHub, Stripe, etc.) POST to /webhooks/ directly —
    # no /api prefix — so keep this as a separate pass-through rule.
    location /webhooks/ {
        proxy_pass http://backend:3001/webhooks/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback: return index.html for any path that isn't a static asset,
    # so React Router handles client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

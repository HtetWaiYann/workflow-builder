server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all backend API routes to the internal backend service.
    # The frontend uses relative paths (VITE_API_URL="") so these requests
    # arrive here and are forwarded — the backend is never exposed to the host.
    location ~ ^/(auth|workflows|executions|workspace|webhooks|health)(/|$) {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward cookies as-is so httpOnly JWT cookies work across the proxy
        proxy_pass_header Set-Cookie;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback: serve index.html for all non-asset routes so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }
}

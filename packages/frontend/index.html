<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply theme class before first paint to prevent flash of wrong theme -->
    <script>
      ;(function () {
        var k = 'triggr-theme'
        var t = 'system'
        try {
          t = localStorage.getItem(k) || 'system'
        } catch (e) {}
        var dark =
          t === 'dark' ||
          (t === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon_io/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon_io/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon_io/apple-touch-icon.png"
    />
    <link rel="manifest" href="/favicon_io/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triggr — Visual Workflow Automation</title>
    <meta
      name="description"
      content="Triggr is a visual workflow automation platform. Build, trigger, and automate multi-step workflows with a drag-and-drop canvas. Connect your tools and automate anything — no code required."
    />
    <meta
      name="keywords"
      content="workflow automation, visual workflow builder, drag-and-drop automation, no-code workflows, workflow engine, task automation, trigger automation"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Triggr" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Triggr" />
    <meta property="og:title" content="Triggr — Visual Workflow Automation" />
    <meta
      property="og:description"
      content="Build, trigger, and automate multi-step workflows with a drag-and-drop canvas. Connect your tools and automate anything."
    />
    <meta property="og:url" content="https://triggr.htetwaiyan.com" />
    <meta property="og:image" content="https://triggr.htetwaiyan.com/thumbnail.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Triggr — Visual Workflow Automation" />
    <meta
      name="twitter:description"
      content="Build, trigger, and automate multi-step workflows with a drag-and-drop canvas. Connect your tools and automate anything."
    />
    <meta name="twitter:image" content="https://triggr.htetwaiyan.com/thumbnail.png" />

    <!-- Browser theme color (matches brand accent) -->
    <meta
      name="theme-color"
      content="#5060d0"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#9090e8"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Structured data for Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Triggr",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Visual workflow automation platform. Build, trigger, and automate multi-step workflows with a drag-and-drop canvas.",
        "offers": {
          "@type": "Offer",
          "price": "0"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
